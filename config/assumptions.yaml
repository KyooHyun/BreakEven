# config/assumptions.yaml
#
# 목적: 코드에 하드코딩하지 않는 외부 가정치를 한 곳에서 관리한다.
# 규칙(CLAUDE.md #3): 이 파일의 값을 쓴 모든 결론은 민감도 분석(L4) 대상이다.
#
# 상태: 매출구간별 수수료율 자체는 확인됨. 업종→구간 매핑은 여전히 가정치 (아래 주석 참고).
status: "매출구간 수수료율 확인 완료 / 업종 매핑은 가정치"
checked_date: "2026-08-25"
source_url: "https://www.bccard.com/app/card/ContentsLinkActn.do?pgm_id=ind1021"  # BC카드 가맹점 수수료율 공시(2025.02.14 우대수수료율 + 2025년 업계평균)

# 매출구간별 수수료율 원본 (검증 완료, 위 source_url 근거)
fee_rate_by_revenue_tier:
  "3억 이하(영세)": 0.0040
  "3~5억(중소)": 0.0100
  "5~10억(중소)": 0.0115
  "10~30억(중소)": 0.0145
  "30억 초과(일반, 업계평균)": 0.0208

# 가맹점 수수료율(f) 가정치 — PROJECT_SPEC.md 4절 참고
# 주의: 공시는 업종별이 아니라 "가맹점 매출규모별" 구간 요율이다. 우리 데이터(card_tpbuz_nm_1
# 업종대분류 9개)에는 가맹점 매출규모 정보가 없어, "이 업종은 대체로 소상공인/대형가맹점 중
# 어느 쪽이 많을까"를 사람이 판단해 위 fee_rate_by_revenue_tier 중 하나를 매핑했다.
# 이 매핑 자체가 프로젝트에서 가장 근거가 약한 가정이며 L4 민감도 분석 최우선 대상이다.
# 매핑 근거(추정, 확정 아님):
#   음식/생활서비스/여가오락 → 개인사업자 비중 높다고 가정 → 영세(0.40%)
#   의료건강/학문교육 → 중소 규모 혼재 → 중소 3~5억(1.00%)
#   소매유통 → 편의점~중형마트 혼재, 유입형 상권(대형 이커머스) 이미 제외됨 → 중소 5~10억(1.15%)
#   공연전시 → 중형~대형 혼재 → 중소 10~30억(1.45%)
#   미디어통신/공공기업단체 → 대기업·통신사·공공기관 위주 → 일반(2.08%)
merchant_fee_rate:
  음식: 0.0040
  생활서비스: 0.0040
  여가/오락: 0.0040
  의료/건강: 0.0100
  학문/교육: 0.0100
  소매/유통: 0.0115
  공연/전시: 0.0145
  미디어/통신: 0.0208
  공공/기업/단체: 0.0208

# 혜택률(r) 스윕 범위 — L3 g* 히트맵에서 사용
benefit_rate_sweep:
  min: 0.003   # 0.3%
  max: 0.020   # 2.0%
  step: 0.001

# g*(필요 증분 이용률) 현실성 임계선
# 이 값을 넘으면 "할인은 답이 아니다"로 판단하는 기준선.
# 근거: 업종별 실측 카드 프로모션 증분 이용률 자료를 검색했으나(2026-08-25) 우리 케이스
# (마트·배달 등 일상 소비재)에 적용할 만한 신뢰할 수 있는 수치를 찾지 못함(찾은 사례는
# 리셀 커머스 특수 프로모션으로 100%+ 증가한 케이스라 일반화 어려움). 대신 사람이
# "이용액이 1.5배 늘어야 손익분기라면 마케팅 캠페인으로 현실적으로 달성하기 어렵다"는
# 보수적 판단으로 50%를 확정(2026-08-25, 사용자 결정). L4에서 이 임계값을 70%/100%로도
# 바꿔서 결론(성립 구간)이 얼마나 민감한지 확인할 것.
g_star_threshold: 0.50

# 세그먼트별 혜택 반응 탄력성 가정 — PROJECT_SPEC.md 2절 확장 논점 반영
# g*(필요 증분 이용률)는 수식 구조상 f·r에만 의존하고 세그먼트 변수가 없다
# (H6, docs/hypothesis-log.md). 세그먼트 차이를 경제성 판단에 반영하려면 "이
# 세그먼트가 혜택률 r에 실제로 얼마나 반응해 이용액을 늘릴지"를 별도로 가정해야
# 한다. 신뢰할 수 있는 세그먼트별(연령대별) 카드 혜택 반응 탄력성 공개 자료를
# 찾지 못했다(2026-08-26 검색 시도). "고정적 소비 습관을 가진 고령층보다 청년층이
# 가격 신호에 더 민감하다"는 통상적 소비자행동 판단으로 상대적 순위만 사람이
# 확정했고, 절대값 근거는 없다 — L4 민감도 분석 필수 대상, 사용자가 최종 검토할 것.
# 정의: expected_g(r) = elasticity_coef * (r / benefit_rate_sweep.min)
#   즉 최소 스윕 혜택률(0.3%)에서 elasticity_coef만큼 증분 이용률이 나온다고 가정하고
#   r이 커지면 선형으로 비례 증가한다고 단순화(선형 가정 자체도 검증 안 됨).
segment_response_elasticity:
  cluster0: 0.05  # 60대 이상 — 소비 습관 고정적, 혜택 반응 낮다고 가정
  cluster1: 0.20  # 10~20대 — 가격 민감도 높다고 가정
  cluster2: 0.10  # 30~60대 — 중간으로 가정

# 이연적립(즉시할인 대신 익월 캐시백 등) 미사용 소멸률 — 이연적립을 쓰면 카드사의
# 실효 비용이 r*(1-소멸률)로 낮아진다는 근거. 신뢰할 수 있는 공개 소멸률 통계를
# 찾지 못해 "포인트 프로그램은 통상 상당수가 미사용 소멸된다"는 업계 통념 수준의
# 보수적 중간값을 사람이 확정. L4 민감도 대상.
deferred_reward_breakage_rate: 0.30

# 연회비 가정치(원/년) — 국내 카드 실질연회비 통상 범위 중 중간값을 사람이 확정.
# 실제 상품 설계 시에는 목표 세그먼트의 지불 의향을 별도 조사해야 함. L4 민감도 대상.
annual_fee_krw: 15000

# 카드 1장당 월평균 이용건수 — 세그먼트별 카드보유자수(N)를 추정하기 위한 환산값.
# 데이터가 집계 데이터라 개인(카드) 단위 이용건수를 직접 관측할 수 없다
# (docs/limitations.md 1번) — 신용카드 이용자의 통상적 월 이용 빈도를 사람이
# 가정치로 확정. N = 세그먼트 월추정이용건수 합 / 이 값. L4 민감도 대상.
avg_monthly_transactions_per_card: 15

random_seed: 42

# 유입형 상권(사업자 소재지 집중 행정동) 식별 기준 — PROJECT_SPEC.md 3절
# 근거: data/processed/01_loaded.parquet 탐색 결과, 성남시 특정 행정동에 인터넷쇼핑/
# 전문서비스/가전제품 매출이 이상 집중(예: admi_cty_no=41135550 top2 업종 비중 98.7%,
# 4개월 매출 13.5조원)되어 있음을 확인. 실제 지역 소비가 아니라 사업자 카드가맹점 주소
# 집중으로 추정.
# 규칙: [업종(card_tpbuz_nm_2) 매출 비중 상위 2개 합 >= top2_category_share_threshold]
#       AND [행정동 총매출이 전체 행정동 중 total_amt_percentile_threshold 분위 이상]
#       을 모두 만족하는 행정동을 유입형으로 플래그.
# 이 임계값 자체가 가정치이므로 L4에서 흔들어 상품 3안이 유지되는지 확인할 것.
inflow_detection:
  top2_category_share_threshold: 0.7
  total_amt_percentile_threshold: 0.9

# =====================================================================
# L5 확장 — 우리카드 이원 결제망(독자망 vs BC 대행망) 가정치
# 사용 스크립트: src/08_woori_dual_network.py (가설 H19~H21)
#
# 배경: 기존 모델의 f는 가맹점 수수료율 하나였다. 우리카드는 같은 결제라도 독자가맹점
# (자체 모집)에서 발생하면 BC카드에 주는 대행(프로세싱) 수수료가 붙지 않고, BC 매입망을
# 타면 붙는다. 즉 카드사가 실제로 손에 쥐는 실효 수수료율이 결제망에 따라 갈린다.
#   f_own = f              (독자망)
#   f_bc  = f - c          (BC 대행망, c = 대행 수수료율)
#   f_eff = a*f_own + (1-a)*f_bc = f - (1-a)*c      (a = 독자망 결제 비중)
#
# 아래 값 중 [확인]만 언론 보도 원문으로 확인된 수치다. c(대행 수수료율) 자체는
# 공개되지 않아 직접 확인이 불가능하며, 스크립트에서 역산·스윕으로만 다룬다.
woori_dual_network:
  checked_date: "2026-09-18"

  # [확인] 독자카드 매출 비중. 출처 원문: "올해 1분기 독자카드 매출 비중은 37.8%로
  # 전년동기(16.2%) 대비 21.6%포인트 상승했다" (뉴스핌 2026-05-21 보도이므로
  # '올해 1분기' = 2026년 1분기, '전년동기' = 2025년 1분기).
  # 주의(가정): 이 지표는 "독자카드(우리카드 자체 브랜드 카드)의 매출 비중"이지
  # "독자가맹점에서 발생한 결제 비중"이 아니다. 모델이 필요로 하는 a는 후자인데
  # 공개 수치가 없어 전자를 대리 지표로 쓴다 — 독자카드로 결제해도 매입이 BC망을 타면
  # 대행 수수료가 발생할 수 있으므로 이 대리값은 실제 a의 상한일 가능성이 높다.
  own_network_share_observed: 0.378      # 2026 1분기 (대리 지표)
  own_network_share_prior: 0.162         # 2025 1분기 (대리 지표)
  own_network_share_label: "독자카드 매출 비중(독자가맹점 결제 비중의 대리 지표)"

  # [확인] 독자가맹점 수 추이 (2025 1분기 -> 2026 1분기). 모델에는 직접 쓰지 않고
  # 우선순위 해석의 정황 근거로만 참조한다.
  own_merchants_prior: 1_754_000
  own_merchants_observed: 1_951_000

  # [확인] BC카드에 지급하던 프로세싱 수수료 규모. 출처 원문: "매년 800억~1000억원
  # 규모의 프로세싱 수수료가 고정비로 지출되는 구조".
  # 이 값을 결제액으로 나눠 c를 역산한다(스크립트 계산0).
  processing_fee_annual_krw_min: 80_000_000_000
  processing_fee_annual_krw_max: 100_000_000_000

  # [확인] 우리카드 2025년 개인 신용판매 이용실적 51조4984억원(점유율 6.5%).
  # c 역산의 분모. 주의(가정): 이 분모로 구한 c는 상한도 하한도 아니다 — 편향 두 개가
  # 방향이 반대라 상쇄되지 않는다.
  #   (c 과대) '개인 신용판매'만이라 법인카드·체크 등을 포함한 실제 매입액보다 작다.
  #   (c 과소) 분자(프로세싱 수수료)는 독자망 전환 전 시점인데 이 분모는 2025년 실적이다.
  #            당시 결제액이 지금보다 작았다면 실제 c는 역산값보다 크다.
  # 2026-09-19 c를 좁히려 4개 경로를 시도했으나 공시 수준에서는 대행 수수료가 분리되지
  # 않아 실패했다(경로별로 어디서 막혔는지는 docs/limitations.md 8번). 특히 BC카드 쪽에서
  # 역산하는 경로는 매입업무수익이 총액(pass-through) 성격이라 원리상 c를 측정하지 못한다.
  # 남은 경로는 DART 원문 주석을 API로 직접 받아 수수료비용 세부 계정을 여는 것뿐이다.
  # 그전까지 c는 아래 격자로만 다룬다 — 단일값으로 확정하지 말 것.
  personal_credit_sales_2025_krw: 51_498_400_000_000

  # [확인, 모델 미사용] 연간 수수료비용 추이(억원). 독자망 확대와 비용 감소가 같은
  # 방향이라는 정황 근거로만 인용한다. 2023·2025는 보도 원문 인용으로 확인했고,
  # 2024년 5531억원은 검색 요약에서만 확인돼 [미확인]으로 표시한다.
  fee_cost_2023_krw: 622_200_000_000
  fee_cost_2024_krw: 553_100_000_000   # [미확인]
  fee_cost_2025_krw: 536_400_000_000

  # c(대행 수수료율) 스윕 격자. 위 역산값 하나에 결론을 걸지 않기 위해 범위로 흔든다.
  # 각 값에 대해 "그 c가 성립하려면 우리카드 연간 결제액이 얼마여야 하는가"를 함께
  # 출력해(계산0) 독자가 타당성을 직접 판단할 수 있게 한다.
  agency_fee_rate_sweep: [0.0005, 0.0010, 0.0015, 0.0020, 0.0025]

  # a(독자망 결제 비중) 스윕 격자 — 0%에서 100%까지 5%p 간격 (스크립트에서 생성).
  own_share_step: 0.05

  # 출처
  source_urls:
    - "https://www.newspim.com/news/view/20260521001222"   # 독자카드 매출 비중·수수료비용·프로세싱 수수료 규모
    - "https://m.ekn.kr/view.php?key=20260127026192660"    # 2025년 개인 신용판매 이용실적(우리카드 51조4984억원)
